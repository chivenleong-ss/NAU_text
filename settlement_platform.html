<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国建筑数字化审计平台</title>
<style>
:root{--brand:#0086c8;--brand-dark:#006da8;--pale:#eaf5fb;--bg:#f3f6f9;--panel:#fff;--line:#dbe4eb;--text:#172b3d;--muted:#718495;--ok:#16805c;--okbg:#eaf7f1;--warn:#a56c00;--warnbg:#fff6df;--bad:#c0443e;--badbg:#fff0ef;--r:4px;--shadow:0 2px 8px rgba(24,55,78,.06);--font:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.top{height:72px;background:var(--brand);color:#fff;display:flex;align-items:center;padding:0 24px;gap:34px;position:fixed;z-index:10;inset:0 0 auto}.logo{font-size:20px;font-weight:700;white-space:nowrap;padding-right:28px;border-right:1px solid rgba(255,255,255,.35)}.global-nav{height:100%;display:flex;gap:4px}.global-nav button{min-width:104px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:transparent;color:#e5f5fd;font-weight:600}.global-nav button:hover,.global-nav button.active{color:#fff;background:rgba(0,0,0,.08);border-bottom-color:#fff}.top-meta{margin-left:auto;display:flex;gap:20px;white-space:nowrap;font-size:12px}.top-meta strong{display:block;font-size:13px;margin-top:3px}.user{border-left:1px solid rgba(255,255,255,.35);padding-left:18px}
.layout{display:grid;grid-template-columns:244px minmax(0,1fr);padding-top:72px;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding-bottom:24px;position:fixed;top:72px;bottom:0;width:244px;overflow:auto}.side-head{height:50px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700}.side-head span{font-size:18px;color:var(--muted)}.side-title{padding:20px 20px 9px;font-size:13px;font-weight:700}.side button{width:100%;min-height:42px;padding:0 20px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:#536c7e}.side button:hover{background:#f3f8fb}.side button.active{color:var(--brand);background:var(--pale);border-left-color:var(--brand);font-weight:700}.badge{float:right;background:#e8eef3;color:var(--muted);border-radius:10px;padding:2px 7px;font-size:12px}
main{grid-column:2;min-width:0;padding:22px 28px 40px}.context{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--text);font-size:18px;margin-right:12px}.actions{display:flex;gap:8px;align-items:center}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:13px;margin-bottom:15px;border-bottom:1px solid var(--line)}.panel-head h2,.panel-head h3{margin:0;font-size:16px}.panel-head h3{font-size:14px}
.btn{min-height:36px;padding:0 15px;border:1px solid #cfdbe4;border-radius:var(--r);background:#fff;color:var(--text);white-space:nowrap}.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark);color:#fff}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}.btn.small{min-height:30px;padding:0 10px;font-size:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-height:36px;padding:7px 10px;border:1px solid #cfdbe4;border-radius:var(--r);background:#fff;color:var(--text);outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,134,200,.12)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-height:88px}.kpi-label{font-size:12px;color:var(--muted)}.kpi-value{margin-top:9px;font-size:22px;font-weight:700;line-height:1.1}.blue{color:var(--brand-dark)}.red{color:var(--bad)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:14px;background:#f8fafc;border:1px solid var(--line);border-radius:var(--r)}.metric strong{font-size:18px}.metric p{margin:8px 0 0;color:var(--muted);font-size:12px}.steps{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.step{padding:12px 8px;text-align:center;border-right:1px solid var(--line);color:var(--muted);font-size:12px;background:#fff}.step:last-child{border-right:0}.step.done{color:var(--brand-dark);background:var(--pale);font-weight:700}.step.active{color:var(--brand-dark);font-weight:700;border-top:3px solid var(--brand);padding-top:9px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{padding:0 2px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted)}.tabs button.active{color:var(--brand-dark);border-bottom-color:var(--brand);font-weight:700}
.status{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;line-height:1.4;white-space:nowrap}.status.blue{color:var(--brand-dark);background:var(--pale)}.status.green{color:var(--ok);background:var(--okbg)}.status.amber{color:var(--warn);background:var(--warnbg)}.status.red{color:var(--bad);background:var(--badbg)}.table-wrap{overflow:auto}.data-table{width:100%;min-width:900px;border-collapse:collapse;font-size:13px}.data-table th{padding:11px 10px;text-align:left;background:#edf4fa;color:#29455a;font-weight:700;white-space:nowrap}.data-table td{padding:12px 10px;border-bottom:1px solid #e7edf2;vertical-align:middle}.data-table tr:hover,.data-table tr.selected{background:#eef8fd}.amount{font-weight:700}.danger-text{color:var(--bad)}
.issue-list{max-height:600px;overflow:auto}.issue{padding:13px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:#fff;cursor:pointer}.issue:hover,.issue.selected{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,134,200,.1)}.issue-title{display:flex;justify-content:space-between;gap:8px;font-weight:700}.issue-meta{margin-top:7px;color:var(--muted);font-size:12px}.issue-money{margin-top:9px;color:var(--bad);font-weight:700}.evidence{padding:14px;background:#f7fafc;border:1px solid var(--line);border-radius:var(--r);line-height:1.8}.evidence p{margin:6px 0;color:var(--muted)}.model-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.model{padding:13px;border:1px solid var(--line);border-radius:var(--r);min-height:128px}.model strong{display:block;color:var(--brand-dark);font-size:13px}.model p{height:34px;margin:9px 0;color:var(--muted);font-size:12px}.model-foot{display:flex;justify-content:space-between;align-items:center;gap:6px}.progress{height:7px;border-radius:5px;background:#e7eef3;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand)}.source-row,.task-row{display:grid;grid-template-columns:1fr 80px 100px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f4}.source-row:last-child,.task-row:last-child{border-bottom:0}.source-name{font-weight:600;margin-bottom:7px}.task-row{grid-template-columns:1fr 120px 100px 90px}.lock{border-left:4px solid var(--bad);background:var(--badbg);padding:16px}.lock strong{color:var(--bad);font-size:16px}.empty{padding:36px;text-align:center;color:var(--muted);background:#fafcfd;border:1px dashed var(--line)}.toast{position:fixed;right:24px;bottom:24px;z-index:30;display:none;padding:11px 16px;background:#263c4c;color:#fff;border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.18)}.toast.show{display:block}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(18,36,50,.45)}.modal.show{display:flex}.modal-box{width:min(620px,100%);background:#fff;border-radius:var(--r);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:16px}
@media(max-width:1200px){.top-meta{display:none}.kpis{grid-template-columns:repeat(3,1fr)}.model-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.top{padding:0 14px}.logo{font-size:16px;padding-right:14px}.global-nav button{min-width:auto;padding:0 10px;font-size:12px}.layout{display:block}.side{position:static;width:auto;height:auto}.side-title{display:none}.side nav{display:flex;overflow:auto}.side button{width:auto;min-width:104px;border-left:0;border-bottom:3px solid transparent}.side button.active{border-left:0;border-bottom-color:var(--brand)}main{padding:16px}.grid-2,.grid-3{grid-template-columns:1fr}.steps{overflow:auto;grid-template-columns:repeat(6,130px)}.model-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{height:60px}.layout{padding-top:60px}.side{top:60px}.global-nav{display:none}.logo{border:0}.kpis,.model-grid{grid-template-columns:1fr}.context{align-items:flex-start;flex-direction:column}.actions{width:100%;overflow:auto}.actions .btn{flex:1}.panel{padding:13px}}
</style>
</head>
<body>
<header class="top"><div class="logo">中国建筑数字化审计平台</div><nav class="global-nav" id="globalNav"><button class="active" data-view="dashboard">审计总览</button><button data-view="preparation">审计准备</button><button data-view="execution">审计执行</button><button data-view="decision">决策与报告</button><button data-view="closure">整改闭环</button></nav><div class="top-meta"><div>当前项目<strong id="topProject">加载中</strong></div><div>审计状态<strong id="topStatus">加载中</strong></div><div class="user">主审 / 管理员</div></div></header>
<div class="layout"><aside class="side"><div class="side-head">数字化审计<span>☰</span></div><div class="side-title" id="sideTitle">审计总览</div><nav id="sideNav"></nav></aside><main><div class="context"><div class="crumb"><b id="pageTitle">审计总览</b><span>工程结算审核智能体 · 当前项目工作台</span></div></div><input id="fileInput" type="file" multiple accept=".csv,.zip" class="hidden"><section id="dashboardView" class="view"></section><section id="preparationView" class="view hidden"></section><section id="executionView" class="view hidden"></section><section id="decisionView" class="view hidden"></section><section id="closureView" class="view hidden"></section></main></div>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3>整改销号</h3><button class="btn small" data-close-modal>关闭</button></div><div id="modalContent"></div><div class="field"><label>凭证编号</label><input id="proofNumber" placeholder="请输入正式凭证编号"></div><div class="field" style="margin-top:12px"><label>凭证类型</label><select id="proofType"><option>冲账凭证</option><option>退款水单</option><option>其他正式凭证</option></select></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn danger" id="closeIssueBtn">确认销号</button></div></div></div>
<script>
const state=window.auditState={data:null,compare:null,view:'dashboard',tab:'review',category:'all',selected:null,modalIssue:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:2});const money=v=>`¥ ${num(v)}`;const text=(v,f='—')=>{const s=String(v??'').replaceAll('�','');return s.includes('闂')||s.includes('缁')||s.includes('瀹')||s.includes('璇')?f:(s||f)};const status=(l,t='blue')=>`<span class="status ${t}">${esc(text(l))}</span>`;async function api(u,o={}){const r=await fetch(u,{...o,headers:o.body?{'Content-Type':'application/json',...(o.headers||{})}:o.headers});if(!r.ok)throw Error(await r.text());return r.json()}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2500)}function typeFor(i){return i?.issue_flags?.length?'red':'green'}
function navItems(v){return{dashboard:[['总览','dashboard']],preparation:[['资料准备','preparation'],['模型目录','models']],execution:[['疑点复核','review'],['三表穿透比对','compare'],['关联链分析','relations']],decision:[['审计结论','decision']],closure:[['整改任务','closure']]}[v]||[]}function setView(v){state.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(v+'View').classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('sideTitle').textContent={dashboard:'审计总览',preparation:'审计准备',execution:'审计执行',decision:'决策与报告',closure:'整改闭环'}[v];renderSide();renderCurrent()}function renderSide(){let a=navItems(state.view);$('sideNav').innerHTML=a.map((x,i)=>`<button class="${x[1]===state.tab||(i===0&&state.tab==='review')?'active':''}" data-tab="${x[1]}">${x[0]}${x[1]==='review'&&state.data?.summary?.high_risk_count?`<span class="badge">${state.data.summary.high_risk_count}</span>`:''}</button>`).join('')}function setTab(t){state.tab=t;renderSide();renderCurrent()}function updateHeader(){let p=state.data.project||{},w=state.data.workflow||{};$('topProject').textContent=text(p.name,'当前项目');$('topStatus').textContent=text(w.phase,'待开展');$('pageTitle').textContent={dashboard:'审计总览',preparation:'审计准备',execution:'审计执行',decision:'决策与报告',closure:'整改闭环'}[state.view]}function renderCurrent(){if(!state.data)return;if(state.view==='dashboard')renderDashboard();if(state.view==='preparation')state.tab==='models'?renderModels():renderPreparation();if(state.view==='execution')state.tab==='compare'?renderCompare():state.tab==='relations'?renderRelations():renderReview();if(state.view==='decision')renderDecision();if(state.view==='closure')renderClosure();updateHeader()}function kpis(a){return`<div class="kpis">${a.map(x=>`<div class="kpi"><div class="kpi-label">${x[0]}</div><div class="kpi-value ${x[2]||''}">${x[1]}</div></div>`).join('')}</div>`}function workflow(){return`<div class="steps">${(state.data.workflow?.status_steps||[]).map(x=>`<div class="step ${x.status}">${esc(text(x.label))}</div>`).join('')}</div>`}
function renderDashboard(){let s=state.data.summary||{},p=state.data.preparation||{},chains=[...(state.data.overview?.business_chains||[]),...(state.data.overview?.governance_chains||[])];$('dashboardView').innerHTML=`${kpis([['累计审减金额',money(s.sum_deducted),'red'],['支付超前敞口',money(s.payment_gap),'red'],['疑点总数',num(s.issue_count),'blue'],['高风险疑点',num(s.high_risk_count),'red'],['资料完整率',num(p.completion_pct)+'%','blue']])}<div class="panel" style="margin-top:16px"><div class="panel-head"><h2>审计流程</h2>${status(text(state.data.workflow?.phase,'待开展'),s.issue_count?'amber':'green')}</div>${workflow()}</div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>风险摘要</h3></div><div class="grid-3"><div class="metric"><span class="muted">数量异常</span><strong>${num(s.over_qty_count)}</strong><p>项</p></div><div class="metric"><span class="muted">价格异常</span><strong>${num(s.over_price_count)}</strong><p>项</p></div><div class="metric"><span class="muted">风险金额</span><strong>${money(s.risk_amount)}</strong><p>需主审确认</p></div></div></div><div class="panel"><div class="panel-head"><h3>准备情况</h3><span class="muted">${num(p.ready_count)} / ${num(p.document_count)} 份</span></div><div class="progress"><i style="width:${Math.min(100,Number(p.completion_pct||0))}%"></i></div><p class="muted">已完成资料识别与结构化，待补资料 ${num(p.pending_count)} 份。</p></div></div><div class="panel"><div class="panel-head"><h3>审计关联链</h3><span class="muted">模型结果 → 证据 → 责任 → 金额</span></div><div class="grid-3">${chains.slice(0,6).map(x=>`<div class="metric"><strong>${esc(text(x.title,'管理链'))}</strong><p>${esc(text(x.description,'待模型结果映射'))}</p><div style="margin-top:10px">${x.count?status(x.count+' 项风险','red'):status('暂无命中','green')}</div></div>`).join('')}</div></div>`}
function renderPreparation(){let p=state.data.preparation||{};$('preparationView').innerHTML=`${kpis([['资料总数',num(p.document_count),'blue'],['已结构化',num(p.ready_count),'blue'],['待补资料',num(p.pending_count),'red'],['资料完整率',num(p.completion_pct)+'%','blue'],['当前项目',text(state.data.project?.id)]])}<div class="panel" style="margin-top:16px"><div class="panel-head"><h2>资料准备</h2><div class="actions"><button class="btn primary" id="prepUpload">导入资料包</button><button class="btn" id="prepReset">重置当前项目数据</button></div></div>${(p.sources||[]).map(x=>`<div class="source-row"><div><div class="source-name">${esc(text(x.name,'资料来源'))}</div><div class="progress"><i style="width:${Number(x.progress||0)}%"></i></div></div><strong>${num(x.progress)}%</strong>${status(text(x.status,'待处理'),Number(x.progress)===100?'green':'amber')}</div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>定时取数任务</h3></div>${(p.robot_tasks||[]).map(x=>`<div class="source-row"><div><div class="source-name">${esc(text(x.name,'取数任务'))}</div><span class="muted">${esc(text(x.schedule,'手动执行'))} · 最近执行 ${esc(text(x.last_run,'未执行'))}</span></div>${status(text(x.status,'待配置'),'amber')}<button class="btn small" data-robot-run="${esc(x.name)}">执行</button></div>`).join('')}</div>`}
function renderModels(){let a=state.data.audit_model_catalog?.models||[];$('preparationView').innerHTML=`<div class="panel"><div class="panel-head"><h2>审核模型目录</h2><button class="btn primary" id="runAll">运行全部模型</button></div><div class="model-grid">${a.map(m=>{let r=(state.data.model_runs||[]).find(x=>x.model_id===m.id);return`<div class="model"><strong>${esc(m.id)} · ${esc(text(m.name,'审核模型'))}</strong><p>${esc(text(m.description,'规则模型'))}</p><div class="model-foot">${status(r?'已运行':'待运行',r?'green':'amber')}<button class="btn small" data-model="${esc(m.id)}">${r?'重跑':'运行'}</button></div></div>`}).join('')}</div></div>`}
function renderReview(){let c=state.compare||{items:[],financial_summary:{}},s=c.financial_summary||{};$('executionView').innerHTML=`${kpis([['送审申报总额',money(s.sum_declared)],['审定总额',money(s.sum_approved)],['累计审减',money(s.sum_deducted),'red'],['已支付',money(s.sum_paid)],['支付超前敞口',money(s.payment_gap),'red']])}<div class="panel" style="margin-top:16px"><div class="tabs"><button class="active">疑点复核</button><button data-tab="compare">三表穿透比对</button><button data-tab="relations">关联链分析</button></div><div class="grid-2"><div class="issue-list">${(c.items||[]).map(i=>`<div class="issue ${state.selected?.item_code===i.item_code?'selected':''}" data-item="${esc(i.item_code)}"><div class="issue-title"><span>${esc(i.item_code)} · ${esc(text(i.name,'结算子目'))}</span>${status(i.issue_flags?.length?'高风险':'正常',typeFor(i))}</div><div class="issue-meta">${esc(text(i.unit,'—'))} · ${esc(text(i.location,'现场记录'))}</div><div class="issue-money">建议审减 ${money(i.amount_deducted)}</div></div>`).join('')||'<div class="empty">暂无疑点数据</div>'}</div><div>${reviewDetail()}</div></div></div>`}function reviewDetail(){let i=state.selected;if(!i)return'<div class="empty">请选择左侧疑点查看证据和处理意见</div>';return`<div class="panel" style="margin:0"><div class="panel-head"><h3>${esc(text(i.name,'结算子目'))}</h3>${status(i.issue_flags?.length?'待主审确认':'正常',typeFor(i))}</div><div class="evidence"><b>规则命中</b><p>${(i.trigger_rules||[]).map(x=>status(String(x).replace(/^\[|\]$/g,''),'amber')).join(' ')||'基础复核通过'}</p><p>合同数量 ${num(i.contract?.quantity)} → 实际数量 ${num(i.actual?.quantity)} → 申报数量 ${num(i.settlement?.quantity)}</p><p>合同单价 ${money(i.contract?.unit_price)} → 申报单价 ${money(i.settlement?.unit_price)}</p><p>建议审减金额 <strong class="danger-text">${money(i.amount_deducted)}</strong></p></div><div class="grid-2" style="margin-top:14px"><div class="field"><label>审定数量</label><input id="approvedQty" type="number" value="${Number(i.approved?.quantity||0)}"></div><div class="field"><label>审定单价</label><input id="approvedPrice" type="number" value="${Number(i.approved?.unit_price||0)}"></div></div><div class="field" style="margin-top:12px"><label>主审意见</label><textarea id="decisionNote" rows="4" placeholder="填写事实、证据和处理依据"></textarea></div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="saveDecision">保存裁决</button><button class="btn primary" id="applyDeduction">确认审减</button></div></div>`}
function renderCompare(){let c=state.compare||{items:[],financial_summary:{}},s=c.financial_summary||{};$('executionView').innerHTML=`<div class="panel"><div class="tabs"><button data-tab="review">疑点复核</button><button class="active">三表穿透比对</button><button data-tab="relations">关联链分析</button></div>${kpis([['申报总额',money(s.sum_declared)],['审定总额',money(s.sum_approved)],['审减金额',money(s.sum_deducted),'red'],['已支付',money(s.sum_paid)],['支付超前敞口',money(s.payment_gap),'red']])}<div class="table-wrap" style="margin-top:16px"><table class="data-table"><thead><tr><th>编码 / 名称</th><th>合同数量 / 金额</th><th>实际数量</th><th>申报数量 / 金额</th><th>审定数量 / 金额</th><th>差异</th><th>审减金额</th><th>状态</th></tr></thead><tbody>${(c.items||[]).map(i=>`<tr class="${state.selected?.item_code===i.item_code?'selected':''}" data-item="${esc(i.item_code)}"><td><b>${esc(i.item_code)}</b><br>${esc(text(i.name,'结算子目'))}</td><td>${num(i.contract?.quantity)} / ${money(i.amount_contract)}</td><td>${num(i.actual?.quantity)}</td><td>${num(i.settlement?.quantity)} / ${money(i.amount_declared)}</td><td>${num(i.approved?.quantity)} / ${money(i.amount_approved)}</td><td>${i.qty_diff_vs_actual>0?status('数量 +'+num(i.qty_diff_vs_actual),'red'):''} ${i.price_deviation_contract>0?status('价格 +'+(i.price_deviation_contract*100).toFixed(2)+'%','amber'):''}</td><td class="amount danger-text">${money(i.amount_deducted)}</td><td>${status(i.status||'待复核',i.status?'green':'amber')}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderRelations(){let a=state.data.relation_chains||[];$('executionView').innerHTML=`<div class="panel"><div class="tabs"><button data-tab="review">疑点复核</button><button data-tab="compare">三表穿透比对</button><button class="active">关联链分析</button></div><div class="grid-2">${a.map(x=>`<div class="metric"><div class="panel-head"><h3>${esc(text(x.title,'审计关联链'))}</h3>${status(text(x.risk_level,'待确认'),'red')}</div><p>模型触发 → 证据切片 → 责任环节 → 金额影响</p><strong class="danger-text">${money(x.amount)}</strong></div>`).join('')||'<div class="empty">模型确认问题后生成关联链</div>'}</div></div>`}
function renderDecision(){let s=state.data.summary||{},d=state.data.decision_analysis||{};$('decisionView').innerHTML=`${kpis([['已确认疑点',num(d.confirmed_issue_count)],['建议审减',money(s.sum_deducted),'red'],['支付风险',money(d.cash_exposure),'red'],['风险单位',num(d.high_risk_units),'blue'],['风险金额',money(d.issue_amount),'red']])}<div class="grid-2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h2>审计结论</h2><button class="btn primary" id="refreshReport">刷新报告</button></div><div class="evidence"><b>结论摘要</b><p>${esc(text(d.conclusion,'待主审确认后生成正式结论'))}</p><p>当前疑点 ${num(s.issue_count)} 项，高风险疑点 ${num(s.high_risk_count)} 项，累计审减 ${money(s.sum_deducted)}。</p></div></div><div class="panel"><div class="panel-head"><h3>报告输出</h3></div><p class="muted">报告根据当前模型结果和主审裁决生成。</p><div class="actions"><button class="btn" id="exportMd">导出 Markdown</button><button class="btn" id="exportJson">导出 JSON</button></div></div></div>`}
function renderClosure(){let a=state.data.remediation_tasks?.tasks||[],gap=state.data.summary?.payment_gap||0;$('closureView').innerHTML=`<div class="panel"><div class="panel-head"><h2>整改任务</h2><span class="muted">${a.length} 项任务</span></div>${a.map(t=>`<div class="task-row"><div><b>${esc(t.issue_id)}</b><div class="muted">${esc(text(t.owner,'项目商务'))}</div></div><strong class="danger-text">${money(t.amount)}</strong>${status(text(t.status,'待复核'),String(t.status).includes('销')?'green':'red')}<button class="btn small" data-proof="${esc(t.issue_id)}">${String(t.status).includes('销')?'查看':'销号'}</button></div>`).join('')||'<div class="empty">暂无整改任务</div>'}</div><div class="panel lock"><strong>${gap>0?'支付锁定中':'支付锁已解除'}</strong><p>${gap>0?'当前存在支付超前敞口 '+money(gap)+'，完成主审确认和整改销号后再解除。':'当前未发现支付超前敞口。'}</p></div>`}
async function load(){try{state.data=await api('/api/settlement-demo/state?category='+state.category);state.compare=await api('/api/settlement-demo/compare?category='+state.category);state.selected=state.compare.items?.find(x=>x.issue_flags?.length)||state.compare.items?.[0]||null;renderCurrent()}catch(e){console.error(e);toast('系统状态加载失败，请检查服务是否启动')}}async function runModel(id){try{let r=await api('/api/settlement-demo/model/'+encodeURIComponent(id)+'/run',{method:'POST'});state.data=r.state;state.compare=await api('/api/settlement-demo/compare?category='+state.category);toast('模型已运行');renderCurrent()}catch(e){toast('模型运行失败')}}async function saveDecision(){if(!state.selected)return toast('请先选择疑点');let issue=(state.data.issues||[]).find(x=>String(x.issue_id||'').includes(state.selected.item_code));if(!issue)return toast('当前子目尚未形成问题包');try{await api('/api/settlement-demo/decision',{method:'POST',body:JSON.stringify({issue_id:issue.issue_id,decision:'confirm',reasoning:$('decisionNote').value,deduction_amount:state.selected.amount_deducted||0})});toast('主审裁决已保存');await load()}catch(e){toast('保存裁决失败')}}async function applyDeduction(){if(!state.selected)return toast('请先选择子目');try{let r=await api('/api/settlement-demo/apply-deduction',{method:'POST',body:JSON.stringify({item_code:state.selected.item_code,approved_qty:$('approvedQty').value,approved_price:$('approvedPrice').value,reason:$('decisionNote').value})});toast('审减已生效，支付敞口 '+money(r.financial_summary?.payment_gap));await load()}catch(e){toast('审减提交失败')}}
function openProof(id){let t=(state.data.remediation_tasks?.tasks||[]).find(x=>x.issue_id===id);if(!t)return;state.modalIssue=id;$('modalContent').innerHTML='<p><b>'+esc(t.issue_id)+'</b></p><p class="muted">整改金额：'+money(t.amount)+' · 当前状态：'+esc(text(t.status,'待复核'))+'</p>';$('proofNumber').value=t.proof_number||'';$('modal').classList.add('show')}
document.addEventListener('click',async e=>{let v=e.target.closest('[data-view]'),t=e.target.closest('[data-tab]'),i=e.target.closest('[data-item]'),m=e.target.closest('[data-model]'),r=e.target.closest('[data-robot-run]'),p=e.target.closest('[data-proof]');if(v){setView(v.dataset.view);return}if(t){if(['review','compare','relations','models'].includes(t.dataset.tab)){state.tab=t.dataset.tab;renderSide();renderCurrent()}else setView(t.dataset.tab);return}if(i){state.selected=(state.compare?.items||[]).find(x=>x.item_code===i.dataset.item)||state.selected;renderCurrent();return}if(m){await runModel(m.dataset.model);return}if(r){try{await api('/api/settlement-demo/robot/run',{method:'POST',body:JSON.stringify({task_name:r.dataset.robotRun})});toast('取数任务已执行');await load()}catch(e){toast('任务执行失败')}return}if(p){openProof(p.dataset.proof);return}if(e.target.id==='prepUpload')$('fileInput').click();if(e.target.id==='prepReset'){try{await api('/api/settlement-demo/reset',{method:'POST'});await load();toast('当前项目数据已重置')}catch(e){toast('重置失败')}}if(e.target.id==='saveDecision')saveDecision();if(e.target.id==='applyDeduction')applyDeduction();if(e.target.id==='runAll'){for(let x of state.data.audit_model_catalog?.models||[])await runModel(x.id);toast('全部模型运行完成')}if(e.target.id==='refreshReport'){await api('/api/settlement-demo/report');toast('报告已刷新');await load()}if(e.target.id==='exportMd')window.open('/api/settlement-demo/export?format=md','_blank');if(e.target.id==='exportJson')window.open('/api/settlement-demo/export?format=json','_blank');if(e.target.closest('[data-close-modal]'))$('modal').classList.remove('show')});
$('fileInput').onchange=async()=>{if(!$('fileInput').files.length)return;let f=new FormData();[...$('fileInput').files].forEach(x=>f.append('files',x));try{let r=await fetch('/api/settlement-demo/upload',{method:'POST',body:f});if(!r.ok)throw Error();state.data=await r.json();state.compare=await api('/api/settlement-demo/compare?category=all');state.selected=state.compare.items?.[0]||null;toast('资料包已导入');renderCurrent()}catch(e){toast('资料导入失败')}};$('closeIssueBtn').onclick=async()=>{let n=$('proofNumber').value.trim();if(!n)return toast('请输入凭证编号');try{await api('/api/settlement-demo/remediation',{method:'POST',body:JSON.stringify({issue_id:state.modalIssue,status:'已销号',proof_number:n,proof_type:$('proofType').value})});$('modal').classList.remove('show');toast('整改已销号');await load()}catch(e){toast('整改销号失败')}};$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};setView('dashboard');load();
</script>
<script>
/* Preparation gate: source layers must be reconciled before core models run. */
(function(){
  const basePreparation=window.renderPreparation;
  const baseModels=window.renderModels;
  window.renderPreparation=function(){
    basePreparation();
    const q=state.data?.data_quality||state.data?.preparation?.data_quality||{};
    const layers=q.source_layers||{};
    const comparison=q.comparison||{};
    const panel=document.createElement('div');
    panel.className='panel';
    panel.innerHTML=`<div class="panel-head"><h3>数据整理与交叉验证</h3>${status(q.status==='confirmed'?'已确认':q.status==='blocked'?'存在阻断错误':'待主审整理',q.status==='confirmed'?'green':q.status==='blocked'?'red':'amber')}</div><div class="grid-3"><div class="metric"><span class="muted">系统抓数</span><strong>${num(layers.system_capture?.records||0)}</strong><p>${esc(text(layers.system_capture?.status,'未接入'))}</p></div><div class="metric"><span class="muted">文档识别</span><strong>${num(layers.document_ocr?.records||0)}</strong><p>${esc(text(layers.document_ocr?.status,'未接入'))}</p></div><div class="metric"><span class="muted">固定宽表</span><strong>${num(layers.canonical_wide_table?.records||comparison.row_count||0)}</strong><p>Schema ${esc(text(q.schema?.version,'V3.2'))} · ${esc(text(layers.canonical_wide_table?.status,'待生成'))}</p></div></div><div class="evidence" style="margin-top:14px"><p>固定粒度：${esc(text(q.schema?.grain,'项目 + 合同 + 清单项 + 期间'))}</p><p>校验方式：${esc(text(comparison.method,'系统抓数 ↔ 文档识别 ↔ 固定统一宽表三方校验'))}</p><p>已匹配 ${num(comparison.source_match_count||0)} 条，未匹配 ${num(comparison.source_unmatched_count||0)} 条；系统抓数匹配 ${num(comparison.system_match_count||0)} 条。</p><p class="${q.error_count?'danger-text':''}">阻断错误 ${num(q.error_count||0)} 条，提示项 ${num(q.warning_count||0)} 条。</p><p>必备资料：${(q.required_documents||[]).map(x=>status(x.label,x.status==='已满足'?'green':'red')).join(' ')||'待生成清单'}</p>${(q.issues||[]).slice(0,5).map(x=>`<p>${status(x.level==='error'?'错误':'提示',x.level==='error'?'red':'amber')} ${esc(text(x.item_code,'全局'))}：${esc(text(x.message,'待处理'))}</p>`).join('')}</div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="confirmQuality" ${q.status==='confirmed'||q.error_count?'disabled':''}>主审确认数据整理</button></div>`;
    $('preparationView').appendChild(panel);
  };
  window.renderModels=function(){
    baseModels();
    const q=state.data?.data_quality||{};
    if(!q.can_run_core_models){
      const panel=document.createElement('div');panel.className='panel lock';panel.innerHTML='<strong>模型运行已锁定</strong><p>请先在审计准备页完成来源匹配、宽表校验和主审确认。</p>';
      $('preparationView').prepend(panel);
    }
  };
  document.addEventListener('click',async function(e){
    if(e.target.id==='confirmQuality'){
      try{const r=await api('/api/settlement-demo/data-quality/confirm',{method:'POST',body:JSON.stringify({operator:'主审'})});state.data=r.state;state.compare=await api('/api/settlement-demo/compare?category='+state.category);toast('数据整理已确认，核心模型已解锁');renderCurrent()}catch(err){toast('数据仍存在阻断错误，请先修正')}}
    if(e.target.closest('[data-model],#runAll') && !state.data?.data_quality?.can_run_core_models){e.preventDefault();e.stopImmediatePropagation();toast('请先完成数据整理确认')}
  },true);
})();
</script>
<script>
/* Three cockpit layer: initial screening, chief review, decision analysis. */
(function(){
  const originalSetView=window.setView;
  const viewMap={initial:'dashboard',chief:'execution',preparation:'preparation',decision:'decision',closure:'closure'};
  const labels={initial:'初审驾驶舱',chief:'主审驾驶舱',preparation:'审计准备',decision:'决策分析看板',closure:'整改闭环'};
  const nav=document.getElementById('globalNav');
  if(nav){nav.innerHTML=Object.entries(labels).map(([id,label],i)=>`<button class="${i===0?'active':''}" data-view="${id}">${label}</button>`).join('')}
  window.setView=function(view){const target=viewMap[view]||view;window._activeCockpit=view;originalSetView(target);document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const title=document.getElementById('pageTitle');if(title)title.textContent=labels[view]||view;const sideTitle=document.getElementById('sideTitle');if(sideTitle)sideTitle.textContent=labels[view]||view};
  const oldRenderDecision=window.renderDecision;
  window.renderDecision=async function(){oldRenderDecision();try{const snapshot=await api('/api/settlement-demo/analysis-snapshot');const p=snapshot.point_line_surface||{};const d=document.getElementById('decisionView');if(!d)return;const metrics=p.metrics||{};const surfaces=p.surfaces||[];d.insertAdjacentHTML('beforeend',`<div class="panel"><div class="panel-head"><h3>点线面经营分析</h3><span class="muted">问题点 → 多关系线 → 管理归因面</span></div><div class="grid-3"><div class="metric"><span class="muted">问题点</span><strong>${num(metrics.point_count)}</strong><p>模型命中并进入分析的具体问题</p></div><div class="metric"><span class="muted">关系线</span><strong>${num(metrics.line_count)}</strong><p>因果、证据、部门、资金关系</p></div><div class="metric"><span class="muted">管理面</span><strong>${num(metrics.surface_count)}</strong><p>命中的 G1-G9 管理归因主题</p></div></div><div class="grid-2" style="margin-top:14px"><div><h3>管理归因面</h3>${surfaces.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin:10px 0"><span style="width:42px;font-weight:700;color:var(--brand-dark)">${esc(x.id)}</span><div style="flex:1"><div style="font-size:12px;margin-bottom:5px">${esc(x.name)}</div><div class="progress"><i style="width:${Math.min(100,(x.point_count||0)*18)}%"></i></div></div><b>${num(x.point_count)} 点</b></div>`).join('')||'<div class="empty">暂无管理归因面</div>'}</div><div><h3>风险效益散点</h3><div class="evidence"><p>风险指数：<strong>${num(metrics.risk_index)}</strong></p><p>真实效益指数：<strong>${num(metrics.effect_index)}</strong></p><p>真实利润还原后：<strong class="danger-text">${money(metrics.real_profit_after_cost)}</strong></p><p>经营建议：优先处置高风险、高金额、低效益项目，形成组织级整改任务。</p></div></div></div></div>`)}catch(e){console.error(e)}};
  window._activeCockpit='initial';window.setView('initial');
})();
</script>
<script>
(function(){
  const baseDashboard=window.renderDashboard;
  const baseDecision=window.renderDecision;
  function chainFlag(ok,label,kind){return ok?status(label,kind||'green'):status(label,'amber')}
  function renderModelChain(steps){
    return `<div class="panel"><div class="panel-head"><h3>模型链</h3><span class="muted">资料进入 → 风险识别 → 模型分析 → 主审复核 → 决策分析 → 报告生成</span></div><div class="grid-3">${(steps||[]).map(step=>`<div class="metric"><strong>${esc(text('Step '+step.step,'Step'))}</strong><p>${esc(text(step.name,'模型步骤'))}</p><div style="margin-top:10px">${(step.models||[]).map(m=>status(m,'blue')).join(' ')}</div></div>`).join('')||'<div class="empty">暂无模型链数据</div>'}</div></div>`;
  }
  function renderNineGrid(surfaces,metrics){
    return `<div class="panel"><div class="panel-head"><h3>九宫格总览</h3><span class="muted">点 · 线 · 面 归并到九大管理归因主题</span></div><div class="grid-3">${(surfaces||[]).map(surface=>`<div class="metric"><strong>${esc(text(surface.id,'G?'))} · ${esc(text(surface.name,'管理归因'))}</strong><p>${esc(text(surface.group||surface.status||'管理面'))}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px"><span>${num(surface.point_count||0)} 点</span><span class="amount">${money(surface.amount||0)}</span></div></div>`).join('')||'<div class="empty">暂无九宫格数据</div>'}</div><div class="grid-3" style="margin-top:12px">${metrics?`<div class="metric"><span class="muted">问题点</span><strong>${num(metrics.point_count||0)}</strong><p>模型命中并进入分析的具体问题</p></div><div class="metric"><span class="muted">关系线</span><strong>${num(metrics.line_count||0)}</strong><p>证据、部门、资金与责任的关系线</p></div><div class="metric"><span class="muted">管理面</span><strong>${num(metrics.surface_count||0)}</strong><p>已命中的管理归因面</p></div>`:''}</div></div>`;
  }
  function renderCrossModelHints(hints){
    const sections=hints?.sections||[];
    const chains=hints?.chains||[];
    return `<div class="panel"><div class="panel-head"><h3>跨模型证据链</h3><span class="muted">G1~G9 · 演进路径 · 三段式公文定论</span></div><div class="grid-2"><div><div class="grid-2">${sections.map(section=>`<div class="metric"><strong>${esc(text(section.section,'阵列'))}</strong><p>命中 ${num(section.count||0)} 条管理链</p></div>`).join('')}</div></div><div class="evidence"><p>总链数：${num(hints?.total_chains||chains.length||0)}</p><p>展示方式：按商务结算合规与公司治理风控两大阵列展开。</p></div></div><div class="grid-2" style="margin-top:14px">${chains.map(chain=>`<div class="metric"><strong>${esc(text(chain.id,'G?'))} · ${esc(text(chain.name,'管理归因链'))}</strong><p>${esc(text(chain.path,'模型点 → 证据线 → 部门线 → 资金线 → 管理面'))}</p><div style="margin:8px 0">${(chain.models||[]).map(m=>status(m,'blue')).join(' ')}</div><div class="evidence"><p>${esc(text(chain.conclusion?.qualitative ? '定性判断已形成' : '定性判断待补'))}</p><p>${esc(text(chain.conclusion?.quantitative ? '量化支撑已形成' : '量化支撑待补'))}</p><p>${esc(text(chain.conclusion?.management ? '管理定论已形成' : '管理定论待补'))}</p></div></div>`).join('')}</div></div>`;
  }
  window.renderDashboard=function(){
    baseDashboard();
    const view=document.getElementById('dashboardView');
    if(!view||!state.data)return;
    const chains=state.data.model_chain?.steps||[];
    const surfaces=state.data.point_line_surface?.surfaces||[];
    const metrics=state.data.point_line_surface?.metrics||{};
    const hints=state.data.cross_model_hints||{};
    view.insertAdjacentHTML('beforeend',`${renderModelChain(chains)}${renderNineGrid(surfaces,metrics)}${renderCrossModelHints(hints)}`);
  };
  window.renderDecision=function(){
    baseDecision();
    const view=document.getElementById('decisionView');
    if(!view||!state.data)return;
    const hints=state.data.cross_model_hints||{};
    const chains=(hints.chains||[]).slice(0,4);
    view.insertAdjacentHTML('beforeend',`<div class="panel"><div class="panel-head"><h3>定论链落地</h3><span class="muted">主审复核后的管理定论摘要</span></div><div class="grid-2">${chains.map(chain=>`<div class="metric"><strong>${esc(text(chain.id,'G?'))} · ${esc(text(chain.name,'管理归因链'))}</strong><p>${esc(text(chain.path,'模型点 → 证据线 → 部门线 → 资金线 → 管理面'))}</p><div style="margin-top:8px">${chainFlag(chain.conclusion?.qualitative,'定性',chain.conclusion?.qualitative?'green':'amber')} ${chainFlag(chain.conclusion?.quantitative,'定量',chain.conclusion?.quantitative?'green':'amber')} ${chainFlag(chain.conclusion?.management,'管理',chain.conclusion?.management?'green':'amber')}</div></div>`).join('')}</div></div>`);
  };
})();
</script>
<script>
/* Phase workspace layer: translate the audit method into a six-stage working order. */
(function(){
  const phaseMap={
    preaudit:{label:'审前分析',view:'dashboard',purpose:'回答审什么、为什么审、先审谁',items:[
      ['组织范围','scope'],['单位风险画像','risk-profile'],['项目与合同概览','project-scope'],['历史审计记录','history'],['初步风险识别','initial-risk'],['审计方案建议','plan'],['知识库与专家会谈','preaudit-knowledge']
    ]},
    cockpit:{label:'主审驾驶舱',view:'dashboard',purpose:'回答当前审到哪、卡在哪、下一步做什么',items:[
      ['当前审计任务','dashboard'],['审计进度','progress'],['待复核问题','review'],['高风险单位','risk-units'],['风险金额与审计价值','value'],['主审待办','todo']
    ]},
    preparation:{label:'审计准备',view:'preparation',purpose:'统一接入资料、完成整理校验并解锁模型',items:[
      ['资料总览','preparation'],['全部资料包导入','upload'],['小机器人抓取任务','robot'],['资料完整性校验','quality'],['原件与识别结果核对','evidence'],['结构化宽表','wide-table'],['模型运行准备度','readiness']
    ]},
    execution:{label:'审计执行',view:'execution',purpose:'模型计算、交叉验证、专家定性并形成疑点池',items:[
      ['模型中心','models'],['模型说明与规则框架','model-spec'],['阈值与规则配置','rules'],['模型运行记录','runs'],['三表穿透比对','compare'],['疑点中心','review'],['专家会审','experts'],['制度知识库','knowledge'],['关联链分析','relations'],['主审复核','decision']
    ]},
    decision:{label:'决策分析',view:'decision',purpose:'把已确认问题转化为审计价值、经营影响和管理动作',items:[
      ['审计成果总览','decision'],['单位与地域风险','risk-map'],['风险金额与可追回金额','amounts'],['真实效益还原','profit'],['管理机制缺陷','mechanism'],['智能审计报告','report'],['历史报告关联引用','history-report']
    ]},
    closure:{label:'整改闭环',view:'closure',purpose:'责任、凭证、支付锁、复核销号和逾期整改完整留痕',items:[
      ['整改任务','closure'],['责任单位与责任人','owners'],['整改凭证上传','proof'],['SAP / 支付锁状态','payment-lock'],['复核销号','close'],['逾期整改','overdue'],['闭环统计','closure-stats']
    ]}
  };
  const phases=Object.keys(phaseMap);
  window.auditPhase=window.auditPhase||'cockpit';
  function phaseFromView(view){return phases.find(key=>phaseMap[key].view===view)||'cockpit'}
  function setPhase(phase,tab){
    const config=phaseMap[phase]||phaseMap.cockpit;
    window.auditPhase=phase;
    window._activeCockpit=phase;
    if(window.originalSetView) window.originalSetView(config.view); else if(window.setView) window.setView(config.view);
    document.querySelectorAll('#globalNav [data-phase]').forEach(x=>x.classList.toggle('active',x.dataset.phase===phase));
    document.querySelectorAll('#sideNav button').forEach(x=>x.classList.toggle('active',x.dataset.phaseTab===(tab||config.items[0][1])));
    const title=document.getElementById('pageTitle'); if(title) title.textContent=config.label;
    const sideTitle=document.getElementById('sideTitle'); if(sideTitle) sideTitle.textContent=config.label;
    const purpose=document.getElementById('phasePurpose'); if(purpose) purpose.textContent=config.purpose;
    renderPhaseSide(config,tab);
    renderPhaseLead(config);
  }
  function renderPhaseSide(config,tab){
    const nav=document.getElementById('sideNav'); if(!nav)return;
    nav.classList.add('phase-side-nav');
    nav.innerHTML=config.items.map((item,i)=>`<button type="button" class="${item[1]===(tab||config.items[0][1])?'active':''}" data-phase-tab="${item[1]}" onclick="window.auditNavigate('${phaseKey(window.auditPhase)}','${item[1]}');return false;">${item[0]}${item[1]==='review'&&window.auditState?.data?.summary?.high_risk_count?`<span class="badge">${window.auditState.data.summary.high_risk_count}</span>`:''}</button>`).join('');
  }
  function phaseKey(value){return String(value||'cockpit').replace(/'/g,'')}
  window.auditNavigate=function(phase,tab){routePhaseTab(phase,tab);return false;};
  function renderPhaseLead(config){
    const main=document.querySelector('main'); if(!main)return;
    let lead=document.getElementById('phaseLead');
    if(!lead){
      lead=document.createElement('section'); lead.id='phaseLead'; lead.className='phase-lead';
      const context=document.querySelector('.context'); if(context) context.after(lead); else main.prepend(lead);
    }
    const d=window.auditState?.data||{}; const s=d.summary||{}; const p=d.project||{}; const q=d.data_quality||{}; const pls=d.point_line_surface||{};
    const metrics=pls.metrics||{};
    lead.innerHTML=`<div><div class="phase-kicker">当前阶段工作台</div><h1>${config.label}</h1><p>${config.purpose}</p></div><div class="phase-context"><span><b>项目</b>${escText(p.name,'尚未建立审计任务')}</span><span><b>疑点</b>${formatNum(s.issue_count)}</span><span><b>风险金额</b>${formatMoney(s.risk_amount||s.sum_deducted||0)}</span><span><b>数据关卡</b>${escText(q.status==='confirmed'?'已确认':q.status==='blocked'?'已阻断':'待整理','待整理')}</span></div><div class="phase-objects"><span class="object-label">点</span>${formatNum(metrics.point_count||s.issue_count)} 个问题/证据对象<span class="object-arrow">→</span><span class="object-label line">线</span>${formatNum(metrics.line_count)} 条模型/证据/责任链<span class="object-arrow">→</span><span class="object-label surface">面</span>${formatNum(metrics.surface_count)} 个风险/经营管理面</div>`;
  }
  function escText(v,f){const s=String(v??'').replaceAll('�','');return s||f}
  function formatNum(v){return Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}
  function formatMoney(v){return '¥ '+Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}
  function makeNav(){
    const nav=document.getElementById('globalNav'); if(!nav)return;
    nav.innerHTML=phases.map(key=>`<button data-phase="${key}" class="${key===window.auditPhase?'active':''}">${phaseMap[key].label}</button>`).join('');
  }
  const baseSetView=window.setView;
  window.originalSetView=baseSetView;
  window.setView=function(view){const phase=phaseFromView(view);setPhase(phase);};
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-phase-tab]')){e.preventDefault();e.stopImmediatePropagation();return;}
    const phase=e.target.closest('[data-phase]');
    if(phase){setPhase(phase.dataset.phase);return;}
    const tab=e.target.closest('[data-phase-tab]');
    if(tab){
      routePhaseTab(window.auditPhase,tab.dataset.phaseTab);
    }
  });
  function routePhaseTab(phase,tab){
    const config=phaseMap[phase]||phaseMap.cockpit;
    const auditState=window.auditState;
    if(!auditState)return;
    auditState.tab=tab;
    if(phase==='preparation'){
      auditState.view='preparation';
      if(window.originalSetView) window.originalSetView('preparation');
      renderPhaseSide(config,tab); renderPhaseLead(config);
      if(tab==='upload'){document.getElementById('fileInput')?.click();}
      if(['quality','readiness','preparation'].includes(tab)){window.renderPreparation&&window.renderPreparation();}
      return;
    }
    if(phase==='execution'){
      auditState.view='execution';
      if(['models','model-spec','rules','runs'].includes(tab)){
        if(window.originalSetView) window.originalSetView('execution');
        renderPhaseSide(config,tab); renderPhaseLead(config);
        window.renderModelWorkbench&&window.renderModelWorkbench();
      }else if(['compare','relations','review'].includes(tab)){
        auditState.tab=tab;
        if(window.originalSetView) window.originalSetView('execution');
        renderPhaseSide(config,tab); renderPhaseLead(config);
        window.renderCurrent&&window.renderCurrent();
      }else{
        if(window.originalSetView) window.originalSetView('execution');
        renderPhaseSide(config,tab); renderPhaseLead(config);
        showPlaceholder(tab);
      }
      return;
    }
    if(phase==='decision'){
      auditState.view='decision';
      if(window.originalSetView) window.originalSetView('decision');
      renderPhaseSide(config,tab); renderPhaseLead(config);
      if(tab==='report'||tab==='history-report') window.renderDecisionValueView&&window.renderDecisionValueView();
      return;
    }
    if(phase==='closure'){
      auditState.view='closure';
      if(window.originalSetView) window.originalSetView('closure');
      renderPhaseSide(config,tab); renderPhaseLead(config);
      if(tab!=='closure') showPlaceholder(tab);
      return;
    }
    auditState.view='dashboard';
    if(window.originalSetView) window.originalSetView('dashboard');
    renderPhaseSide(config,tab); renderPhaseLead(config);
    if(tab!=='dashboard') showPlaceholder(tab);
  }
  function showPlaceholder(tab){
    const target=document.querySelector('.view:not(.hidden)');
    if(!target)return;
    const labels={
      scope:'组织范围与审计任务', 'risk-profile':'单位风险画像','project-scope':'项目与合同概览',history:'历史审计记录','initial-risk':'初步风险识别',plan:'审计方案建议','preaudit-knowledge':'知识库与专家会谈',
      upload:'全部资料包导入',robot:'小机器人抓取任务',quality:'资料完整性校验',evidence:'原件与识别结果核对','wide-table':'结构化宽表',readiness:'模型运行准备度',
      progress:'审计进度','risk-units':'高风险单位','value':'风险金额与审计价值',todo:'主审待办',experts:'专家会审',knowledge:'制度知识库',
      'risk-map':'单位与地域风险','amounts':'风险金额与可追回金额',profit:'真实效益还原',mechanism:'管理机制缺陷','history-report':'历史报告关联引用',
      owners:'责任单位与责任人',proof:'整改凭证上传','payment-lock':'SAP / 支付锁状态',close:'复核销号',overdue:'逾期整改','closure-stats':'闭环统计'
    };
    target.innerHTML=`<div class="panel"><div class="panel-head"><h2>${labels[tab]||tab}</h2><span class="muted">当前阶段工作台</span></div><div class="empty">该工作项已进入导航结构，关联数据和操作面板将在此处展开。</div></div>`;
  }
  const style=document.createElement('style');
  style.textContent=`
    .phase-lead{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);padding:17px 20px;margin-bottom:16px;display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(420px,1fr);gap:14px;align-items:center}
    .phase-kicker{font-size:11px;color:var(--muted);letter-spacing:1px}.phase-lead h1{font-size:23px;margin:4px 0 6px}.phase-lead p{margin:0;color:var(--muted)}.phase-context{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.phase-context span{border-left:1px solid var(--line);padding-left:12px;color:var(--text);font-size:13px}.phase-context b{display:block;color:var(--muted);font-size:11px;margin-bottom:3px;font-weight:400}.phase-objects{grid-column:1/-1;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.object-label{display:inline-flex;width:23px;height:23px;align-items:center;justify-content:center;border-radius:50%;background:#e7f4fc;color:#006da8;font-weight:700;margin-right:5px}.object-label.line{background:#eaf7f1;color:#16805c}.object-label.surface{background:#fff3df;color:#a56c00}.object-arrow{margin:0 9px;color:#b5c4ce}
    #sideNav button{position:relative}.phase-lead+*{}
    @media(max-width:900px){.phase-lead{grid-template-columns:1fr}.phase-objects{grid-column:auto}.phase-context{grid-template-columns:repeat(2,1fr)}}
  `;
  document.head.appendChild(style);
  makeNav();
  setTimeout(()=>setPhase(window.auditPhase||'cockpit'),0);
})();
</script>
<script>
(function(){
  const audit=()=>window.auditState;
  const apiCall=(url,options)=>fetch(url,options).then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.message||'请求失败');return data});
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const notify=message=>window.toast?window.toast(message):alert(message);
  const modelId=()=>document.querySelector('[data-model-spec].selected')?.dataset.modelSpec||document.querySelector('[data-model-spec]')?.dataset.modelSpec||'';

  async function generatePackage(){
    try{
      const result=await apiCall('/api/settlement-demo/demo-package/generate',{method:'POST'});
      notify('演示资料包已生成，请下载后在本页导入');
      const link=document.getElementById('downloadDemoPackage'); if(link)link.classList.remove('hidden');
      const meta=document.getElementById('demoPackageMeta'); if(meta)meta.textContent=`已生成 ${result.package.file_count} 份资料 · 可下载后导入当前任务`;
    }catch(error){notify(error.message)}
  }
  function renderPreparationActions(){
    const view=document.getElementById('preparationView'); if(!view||document.getElementById('demoPackagePanel'))return;
    const panel=document.createElement('section'); panel.id='demoPackagePanel'; panel.className='panel';
    panel.innerHTML=`<div class="panel-head"><div><h2>资料包入口</h2><span class="muted">演示资料先生成成真实文件，再由审计人员导入识别</span></div><div class="actions"><button class="btn" id="generateDemoPackage">生成演示资料包</button><button class="btn primary hidden" id="downloadDemoPackage">下载资料包</button><button class="btn" id="openPackageUpload">导入资料包</button></div></div><div class="evidence"><p id="demoPackageMeta">当前工作区为空。可以导入真实资料，也可以先生成一套可查阅的演示资料。</p><p>资料进入统一资料池后，再执行 OCR/字段识别、统一宽表生成、三方校验和主审确认。</p></div>`;
    view.prepend(panel);
    document.getElementById('generateDemoPackage').onclick=generatePackage;
    document.getElementById('downloadDemoPackage').onclick=()=>window.open('/api/settlement-demo/demo-package/download','_blank');
    document.getElementById('openPackageUpload').onclick=()=>document.getElementById('fileInput')?.click();
  }
  const basePreparation=window.renderPreparation;
  window.renderPreparation=function(){if(basePreparation)basePreparation();renderPreparationActions()};

  function renderModelWorkbench(){
    const view=document.getElementById('executionView'); if(!view)return;
    const data=audit()?.data||{}; const catalog=data.audit_model_catalog||{}; const models=catalog.models||[]; const selected=modelId()||models.find(x=>x.id==='M0')?.id||models[0]?.id||'';
    view.innerHTML=`<div class="panel model-workbench"><div class="panel-head"><div><h2>模型中心</h2><span class="muted">双轨为经，业财法工穿透为纬；共 12 个业务模型 + 1 个前置过滤节点</span></div><button class="btn primary" id="runAllFromWorkbench">开始完整审计</button></div><div class="model-layout"><div class="model-index">${models.map(model=>`<button class="model-index-item ${model.id===selected?'selected':''}" data-model-spec="${escapeHtml(model.id)}"><strong>${escapeHtml(model.id)}</strong><span>${escapeHtml(model.name)}</span><small>${escapeHtml(model.phase||'审计执行')} · ${escapeHtml(model.track||'规则模型')}</small></button>`).join('')}</div><div id="modelSpecDetail"></div></div></div>`;
    renderModelSpec(selected);
    view.querySelectorAll('[data-model-spec]').forEach(button=>button.onclick=()=>{view.querySelectorAll('[data-model-spec]').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');renderModelSpec(button.dataset.modelSpec)});
    document.getElementById('runAllFromWorkbench').onclick=async()=>{try{const r=await apiCall('/api/settlement-demo/models/run-all',{method:'POST'});audit().data=r.state;notify('完整审计运行完成');renderModelWorkbench()}catch(error){notify(error.message)}};
  }
  async function renderModelSpec(id){
    const detail=document.getElementById('modelSpecDetail'); if(!detail||!id)return;
    detail.innerHTML='<div class="empty">正在加载模型说明...</div>';
    try{
      const result=await apiCall('/api/settlement-demo/model-rules?model_id='+encodeURIComponent(id)); const model=result.models?.[0]||{}; const run=(audit()?.data?.model_runs||[]).find(x=>x.model_id===id);
      const thresholds=model.thresholds||{};
      detail.innerHTML=`<div class="model-spec-head"><div><div class="phase-kicker">正式模型说明页</div><h2>${escapeHtml(model.id)} · ${escapeHtml(model.name||'模型')}</h2><p>${escapeHtml(model.description||'该模型负责对业务资料进行确定性规则计算、证据绑定和疑点输出。')}</p></div>${statusBadge(run?'已运行':'待运行',run?'green':'amber')}</div><div class="spec-grid"><div class="evidence"><h3>模型定位</h3><p>轨道：${escapeHtml(model.track||'双轨穿透')}</p><p>阶段：${escapeHtml(model.phase||'审计执行')}</p><p>规则来源：${escapeHtml(model.rule_source||'模型建设/规则清单.md')}</p><p>关联管理链：${(model.management_chains||model.chains||[]).map(escapeHtml).join('、')||'由模型命中后自动生成 G1-G9 关联链'}</p></div><div class="evidence"><h3>执行链路</h3><p>资料完整性检查 → 统一宽表 → 确定性计算 → 规则过滤 → 证据绑定 → 问题分级 → 专家/主审复核</p><p>当前输入资料：${Number(run?.input_documents||audit()?.data?.preparation?.document_count||0)} 份，宽表行：${Number(run?.input_rows||audit()?.data?.items?.length||0)} 行。</p></div></div><div class="panel rule-editor"><div class="panel-head"><h3>阈值与规则配置</h3><span class="status blue">规则版本 ${escapeHtml(model.rule_version||'V1.0')}</span></div><div class="grid-2">${Object.entries(thresholds).map(([key,value])=>`<div class="field"><label>${escapeHtml(key)}</label><input data-rule-key="${escapeHtml(key)}" type="number" step="0.01" value="${Number(value)}"></div>`).join('')}</div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="runSelectedModel">保存后重跑模型</button><button class="btn primary" id="saveModelRules">保存规则版本</button></div></div><div class="evidence"><h3>输出解释</h3><p>每个命中结果都会记录模型编码、规则版本、阈值、来源资料、证据定位、风险金额和管理归因链。</p><p>本模型不会直接替代主审结论；单规则命中先进入疑点池，经交叉验证后再进入专家和主审环节。</p></div>`;
      document.getElementById('saveModelRules').onclick=async()=>{const body={model_id:id,operator:'主审',thresholds:{}};detail.querySelectorAll('[data-rule-key]').forEach(input=>body.thresholds[input.dataset.ruleKey]=Number(input.value));try{const saved=await apiCall('/api/settlement-demo/model-rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});notify(saved.message);renderModelSpec(id)}catch(error){notify(error.message)}};
      document.getElementById('runSelectedModel').onclick=async()=>{try{const r=await apiCall('/api/settlement-demo/model/'+encodeURIComponent(id)+'/run',{method:'POST'});audit().data=r.state;notify('模型已按当前规则重跑');renderModelSpec(id)}catch(error){notify(error.message)}};
    }catch(error){detail.innerHTML=`<div class="empty">模型说明加载失败：${escapeHtml(error.message)}</div>`}
  }
  function statusBadge(label,kind){return `<span class="status ${kind}">${escapeHtml(label)}</span>`}
  document.addEventListener('click',event=>{
    const tab=event.target.closest('[data-phase-tab]'); if(!tab)return;
    if(['models','model-spec','rules','runs'].includes(tab.dataset.phaseTab)){setTimeout(renderModelWorkbench,0)}

<script>
(function(){

  function ensureDrawer(){

    document.body.appendChild(drawer);

    `; document.head.appendChild(style);
  }
  function openDrawer(title,body){ensureDrawer();document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;document.getElementById('contextDrawer').classList.add('show')}
  function issueContext(issue){
    let evidence=[];try{const raw=issue?.evidence_json?JSON.parse(issue.evidence_json||'[]'):(issue?.evidence||[]);evidence=Array.isArray(raw)?raw:(raw?[raw]:[])}catch(_){evidence=[]} const data=audit()?.data||{};
    openDrawer('疑点关联依据',`<section class="drawer-section"><h3>${escHtml(issue?.title||'当前疑点')}</h3><p>问题状态：${escHtml(issue?.status||'待主审复核')} · 管理链：${escHtml(issue?.chain_type||'待归因')} · 金额影响：${money(issue?.amount_impact)}</p></section><section class="drawer-section"><h3>证据页</h3>${evidence.map(item=>`<div class="evidence"><b>${escHtml(item.document||item.name||'原始资料')}</b><p>${escHtml(item.location||item.page||'待定位')}</p><p>${escHtml(item.fact||item.content||'已绑定该疑点的来源证据')}</p><button class="btn small" data-preview-source="${escHtml(item.document||'原始资料')}">预览原件</button></div>`).join('')||'<p>当前疑点尚未绑定证据页。</p>'}</section><section class="drawer-section"><h3>制度条款</h3>${(data.knowledge||[]).slice(0,4).map(k=>`<p><b>${escHtml(k.clause)}</b>：${escHtml(k.content)}</p>`).join('')||'<p>暂无制度条款。</p>'}</section><section class="drawer-section"><h3>历史报告原文</h3><p>系统会在接入历史报告库后按问题类型、责任单位和金额口径自动召回原文；当前演示显示为可替换的引用位。</p><button class="btn small" data-preview-history>查看历史报告全文</button></section>`);
  }
  function renderDecisionValueView(){
    const view=document.getElementById('decisionView'); if(!view)return; const data=audit()?.data||{}; const summary=data.summary||{}; const decision=data.decision_analysis||{}; const pls=data.point_line_surface||{}; const departments=pls.department_matrix||[]; const surfaces=(pls.surfaces||[]).filter(x=>x.point_count).slice(0,9); const total=Math.max(...departments.map(x=>Number(x.risk_amount||0)),1);
    view.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>审计成果与经营决策</h2><span class="muted">主审确认后的问题，向金额、单位、责任和管理动作聚合</span></div><div class="actions"><button class="btn" id="openReportEditor">智能写报告</button><button class="btn primary" id="exportDecisionMd">导出报告草稿</button></div></div><div class="decision-grid"><div class="decision-metric red"><span>问题金额</span><strong>${money(decision.issue_amount||summary.risk_amount)}</strong></div><div class="decision-metric red"><span>支付超前敞口</span><strong>${money(decision.cash_exposure||summary.payment_gap)}</strong></div><div class="decision-metric green"><span>预计可追回 / 审减</span><strong>${money(decision.profit_recovery||summary.sum_deducted)}</strong></div><div class="decision-metric"><span>确认问题数</span><strong>${num(decision.confirmed_issue_count)}</strong></div></div></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>责任部门风险面</h3><span class="muted">金额分布用于安排整改和复核资源</span></div><div class="value-bars">${departments.map(row=>`<div class="value-bar"><span>${escHtml(row.department)}</span><div class="value-track"><i style="width:${Math.min(100,Number(row.risk_amount||0)/total*100)}%"></i></div><b>${money(row.risk_amount)}</b></div>`).join('')||'<div class="empty">导入并运行模型后生成部门风险面</div>'}</div></div><div class="panel"><div class="panel-head"><h3>管理归因面</h3><span class="muted">九大管理链命中情况</span></div>${surfaces.map(x=>`<div class="source-row"><div><div class="source-name">${escHtml(x.id)} · ${escHtml(x.name)}</div><span class="muted">${num(x.point_count)} 个问题点 · ${money(x.amount)}</span></div>${statusTag(x.status==='hit'?'已命中':'待观察',x.status==='hit'?'red':'amber')}<button class="btn small" data-open-chain="${escHtml(x.id)}">查看链路</button></div>`).join('')||'<div class="empty">当前没有已确认的管理归因面</div>'}</div></div><div class="panel"><div class="panel-head"><h3>审计价值解释</h3><span class="muted">风险识别 → 审减/追回 → 真实效益 → 管理动作</span></div><div class="evidence"><p>${escHtml(decision.conclusion||'当前项目尚未形成正式经营决策结论。')}</p><p>本页面不把疑点数量当作审计价值，而是把问题金额、支付锁、可追回金额和真实利润还原分开呈现。</p></div></div>`;
    document.getElementById('openReportEditor').onclick=()=>openReportEditor();
    document.getElementById('exportDecisionMd').onclick=()=>window.open('/api/settlement-demo/export?format=md','_blank');
  }
  function statusTag(label,kind){return `<span class="status ${kind}">${escHtml(label)}</span>`}
  function openReportEditor(){
    const data=audit()?.data||{}; const issues=(data.issues||[]).slice(0,8); const first=issues[0]; const savedDraft=data.report?.draft||''; const draft=savedDraft||`一、审计发现\n${first?`经核查，${first.title}，涉及金额 ${money(first.amount_impact)}。`: '当前尚未确认问题。'}\n\n二、证据与依据\n请从右侧引用证据页、制度条款和历史报告原文。\n\n三、管理建议\n由主审确认定性、金额和责任单位后形成正式结论。`;
    openDrawer('智能审计报告',`<section class="drawer-section"><h3>按问题池逐段生成</h3><p class="muted">${savedDraft?'已加载上次保存的草稿':'当前为初始报告草稿'}</p><textarea class="report-editor" id="reportDraft">${escHtml(draft)}</textarea><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="insertIssueConclusion">插入当前问题结论</button><button class="btn primary" id="saveReportDraft">保存报告草稿</button></div></section><section class="drawer-section"><h3>关联问题池</h3>${issues.map(issue=>`<div class="source-row"><div><b>${escHtml(issue.title)}</b><div class="muted">${escHtml(issue.issue_id)} · ${money(issue.amount_impact)}</div></div><button class="btn small" data-open-issue="${escHtml(issue.issue_id)}">打开依据</button></div>`).join('')||'<p>暂无问题池记录。</p>'}</section><section class="drawer-section"><h3>引用规则</h3><p>每段报告结论需要保留问题编号、来源证据、制度条款、金额计算和规则版本。</p></section>`);
    document.getElementById('insertIssueConclusion').onclick=()=>{const area=document.getElementById('reportDraft');if(first)area.value+=`\n\n[${first.issue_id}] ${first.title}，金额影响 ${money(first.amount_impact)}，状态 ${first.status}。`};
    document.getElementById('saveReportDraft').onclick=async()=>{try{const result=await apiCall('/api/settlement-demo/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft:document.getElementById('reportDraft').value,author:'主审'})});audit().data=result.state;toast('报告草稿已保存');renderDecisionValueView()}catch(error){toast(error.message)}};
  }
  const baseDecision=window.renderDecision;
  window.renderDecision=function(){renderDecisionValueView()};
  document.addEventListener('click',event=>{
    if(event.target.closest('[data-close-context]'))document.getElementById('contextDrawer')?.classList.remove('show');
    const issueButton=event.target.closest('[data-open-issue]'); if(issueButton){const issue=(audit()?.data?.issues||[]).find(x=>x.issue_id===issueButton.dataset.openIssue);if(issue)issueContext(issue)}
    const source=event.target.closest('[data-preview-source]'); if(source)openDrawer('原件预览',`<section class="drawer-section"><h3>${escHtml(source.dataset.previewSource)}</h3><p>这里显示资料预览、页码/行号定位和 OCR 识别结果。接入 PDF 或扫描件后，预览器将在此处加载真实原件。</p><div class="evidence"><p>当前演示资料已保留来源文件名和证据定位，避免报告只显示一段脱离上下文的文字。</p></div></section>`);
    if(event.target.closest('[data-preview-history]')){openDrawer('历史报告原文','<section class="drawer-section"><p>正在检索本地历史报告...</p></section>');apiCall('/api/settlement-demo/history-reports').then(result=>{const reports=result.reports||[];openDrawer('历史报告原文',`<section class="drawer-section"><h3>本地历史报告</h3>${reports.map(item=>`<div class="source-row"><div><b>${escHtml(item.name)}</b><div class="muted">${escHtml(item.category)}</div></div><button class="btn small" data-preview-source="${escHtml(item.name)}">查看全文</button></div>`).join('')||'<p>当前资料包未发现历史报告文件。</p>'}</section>`)}).catch(error=>openDrawer('历史报告原文',`<section class="drawer-section"><p>${escHtml(error.message)}</p></section>`));}
    const chain=event.target.closest('[data-open-chain]'); if(chain){const surface=(audit()?.data?.point_line_surface?.surfaces||[]).find(x=>x.id===chain.dataset.openChain);openDrawer(`${surface?.id||''} 管理归因链`, `<section class="drawer-section"><h3>${escHtml(surface?.name||'管理归因链')}</h3><p>模型命中 → 证据线 → 责任部门 → 金额影响 → 整改措施</p><p>关联模型：${(surface?.models||[]).map(escHtml).join('、')||'待生成'}</p><p>问题点：${num(surface?.point_count)} · 金额：${money(surface?.amount)}</p></section>`)}
    if(event.target.closest('[data-open-context]')){const id=event.target.closest('[data-open-context]').dataset.openContext;const issue=(audit()?.data?.issues||[]).find(x=>x.issue_id===id);if(issue)issueContext(issue)}
  });
  window.renderDecisionValueView=renderDecisionValueView;
})();
</script>
<script>
(function(){

  const apiCall=(url,options)=>fetch(url,options).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'请求失败');return d});
  const toast=message=>window.toast?window.toast(message):alert(message);
  function renderScopeWorkbench(){
    const target=document.getElementById('dashboardView'); if(!target)return;

    apiCall('/api/settlement-demo/scope/options').then(data=>{
      const body=document.getElementById('scopeWorkbenchBody'); const task=data.audit_task; const project=data.projects?.[0];

        body.className='scope-frozen'; body.innerHTML=`<div class="scope-freeze-head"><div><div class="phase-kicker">当前审计任务</div><h2>${escHtml(task.id)}</h2><p>${escHtml(task.project_name)} · ${escHtml(task.org_name)}</p></div><span class="status green">${escHtml(task.status)}</span></div><div class="decision-grid"><div class="decision-metric"><span>组织</span><strong>${escHtml(task.org_name)}</strong></div><div class="decision-metric"><span>项目</span><strong>${escHtml(task.project_name)}</strong></div><div class="decision-metric"><span>合同数</span><strong>${task.contract_ids.length}</strong></div><div class="decision-metric"><span>资料 / 宽表行</span><strong>${task.data_snapshot.document_count} / ${task.data_snapshot.item_count}</strong></div></div><div class="evidence" style="margin-top:14px"><p>模型版本：${escHtml(task.model_version)} · 规则版本：${escHtml(task.rule_version)}</p><p>创建时间：${escHtml(task.created_at)} · 负责人：${escHtml(task.owner)}</p><p>如需扩大或缩小范围，应创建新任务版本，不直接覆盖本次审计结果。</p></div>`;

      document.getElementById('createAuditTask').onclick=async()=>{const ids=[...document.querySelectorAll('input[name="scopeContract"]:checked')].map(x=>x.value);try{const result=await apiCall('/api/settlement-demo/audit-task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({org_code:document.getElementById('scopeOrg').value,project_id:document.getElementById('scopeProject').value,contract_ids:ids,owner:document.getElementById('scopeOwner').value})});audit().data=result.state;toast('审计任务已创建，范围已冻结');renderScopeWorkbench()}catch(error){toast(error.message)}};
    }).catch(error=>{const body=document.getElementById('scopeWorkbenchBody');if(body)body.innerHTML=`<div class="empty">范围数据加载失败：${escHtml(error.message)}</div>`});
  }
  const previousNavigate=window.auditNavigate;
  window.auditNavigate=function(phase,tab){
    if(phase==='preaudit'&&(tab==='scope'||tab==='project-scope')){
      if(previousNavigate)previousNavigate(phase,tab);
      setTimeout(renderScopeWorkbench,0);

    return previousNavigate?previousNavigate(phase,tab):false;
  };
  window.renderScopeWorkbench=renderScopeWorkbench;

})();
