  const audit=()=>window.auditState;
  const escHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const apiCall=(url,options)=>fetch(url,options).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'请求失败');return d});
  const toast=message=>window.toast?window.toast(message):alert(message);
  const stage=(number,title,description,state,action)=>`<div class="prep-stage ${state}"><div class="prep-stage-num">${number}</div><div class="prep-stage-copy"><strong>${title}</strong><span>${description}</span></div><span class="status ${state==='done'?'green':state==='blocked'?'red':'amber'}">${state==='done'?'已完成':state==='blocked'?'待处理':'待执行'}</span>${action||''}</div>`;
  function renderPreparationGate(){
    const view=document.getElementById('preparationView'); if(!view)return;
    let panel=document.getElementById('preparationGate'); if(!panel){panel=document.createElement('section');panel.id='preparationGate';panel.className='panel';view.appendChild(panel)}
    const data=audit()?.data||{}; const prep=data.preparation||{}; const quality=data.data_quality||{}; const docs=Number(prep.document_count||0); const hasData=docs>0||Number(data.structured_model?.summary?.item_count||0)>0; const m0=(data.model_runs||[]).find(x=>x.model_id==='M0'); const coreRuns=(data.model_runs||[]).filter(x=>x.model_id!=='M0').length; const canRun=quality.can_run_core_models===true;
    panel.innerHTML=`<div class="panel-head"><div><h2>审计准备关卡</h2><span class="muted">资料进入统一池，完成数据整理确认后才能解锁核心模型</span></div><span class="status ${canRun?'green':hasData?'amber':'blue'}">${canRun?'核心模型已解锁':hasData?'待主审确认':'等待资料导入'}</span></div><div class="prep-stages">${stage(1,'资料导入','全部资料包或真实资料进入当前审计任务',hasData?'done':'pending',hasData?'':'<button class="btn small" data-prep-action="upload">导入资料</button>')}${stage(2,'M0 前置过滤','资料完整性、统一宽表和来源层检查',m0?'done':hasData?'pending':'blocked',m0?'':hasData?'<button class="btn small" data-prep-action="m0">运行 M0</button>':'')}${stage(3,'主审确认数据整理','检查必备资料、来源匹配和宽表差异',quality.status==='confirmed'?'done':quality.status==='blocked'?'blocked':hasData?'pending':'blocked',quality.status==='confirmed'?'':hasData?'<button class="btn small" data-prep-action="confirm">主审确认</button>':'')}${stage(4,'核心模型准备度','确认后解锁 12 个业务模型',canRun?'done':quality.status==='blocked'?'blocked':'pending',canRun?'':quality.status==='blocked'?'':'等待主审确认')}${stage(5,'开始完整审计',`已运行 ${coreRuns} / 12 个业务模型`,coreRuns>=12?'done':canRun?'pending':'blocked',canRun?'<button class="btn small primary" data-prep-action="run-all">运行全部模型</button>':'')}</div><div class="prep-gate-note"><b>当前资料状态：</b>${docs} 份资料 · ${Number(data.structured_model?.summary?.item_count||0)} 行宽表 · ${Number(data.summary?.issue_count||0)} 个疑点。模型结果不会在未导入资料时预置。</div>`;
  }
  async function prepAction(action){
    try{
      if(action==='upload'){document.getElementById('fileInput')?.click();return}
      if(action==='m0'){const result=await apiCall('/api/settlement-demo/model/M0/run',{method:'POST'});audit().data=result.state;toast('M0 前置过滤已完成');}
      if(action==='confirm'){const result=await apiCall('/api/settlement-demo/data-quality/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator:'主审'})});audit().data=result.state;toast('数据整理已确认，核心模型已解锁');}
      if(action==='run-all'){const result=await apiCall('/api/settlement-demo/models/run-all',{method:'POST'});audit().data=result.state;toast(`完整审计完成，共运行 ${result.runs.length} 个节点`);}
      window.renderPreparation&&window.renderPreparation(); renderPreparationGate();
    }catch(error){toast(error.message);renderPreparationGate()}
  }
  document.addEventListener('click',event=>{const button=event.target.closest('[data-prep-action]');if(button){event.preventDefault();event.stopImmediatePropagation();prepAction(button.dataset.prepAction)}} ,true);
  const previous=window.renderPreparation;
  window.renderPreparation=function(){if(previous)previous();setTimeout(renderPreparationGate,0)};
  window.renderPreparationGate=renderPreparationGate;
  const style=document.createElement('style');style.textContent=`.prep-stages{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.prep-stage{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:13px 14px;background:#fff;border-bottom:1px solid var(--line)}.prep-stage:last-child{border-bottom:0}.prep-stage.done{background:#f5fbf8}.prep-stage.blocked{background:#fff8f7}.prep-stage-num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#e9f1f5;color:var(--muted);font-weight:700}.prep-stage.done .prep-stage-num{background:var(--ok);color:#fff}.prep-stage.blocked .prep-stage-num{background:var(--bad);color:#fff}.prep-stage-copy{display:grid;gap:4px}.prep-stage-copy strong{font-size:13px}.prep-stage-copy span{font-size:12px;color:var(--muted)}.prep-gate-note{margin-top:12px;padding:11px 13px;background:#f7fafc;color:var(--muted);font-size:12px}.prep-gate-note b{color:var(--text)}@media(max-width:700px){.prep-stage{grid-template-columns:28px 1fr auto}.prep-stage .btn{grid-column:2/-1;justify-self:start}}`;document.head.appendChild(style);
})();
</script>
<script>
(function(){
  const audit=()=>window.auditState;
  const escHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=value=>'¥ '+Number(value||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
  const num=value=>Number(value||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
  const toast=message=>window.toast?window.toast(message):alert(message);
  const apiCall=(url,options)=>fetch(url,options).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'请求失败');return d});
  let selectedIssueId='';
  function currentIssues(){return audit()?.data?.issues||[]}
  function renderExecutionWorkbench(){
    const view=document.getElementById('executionView'); if(!view)return;
    const data=audit()?.data||{}; const issues=currentIssues(); if(!selectedIssueId)selectedIssueId=issues[0]?.issue_id||''; const selected=issues.find(x=>x.issue_id===selectedIssueId)||issues[0]; if(selected)selectedIssueId=selected.issue_id;
    const high=issues.filter(x=>x.risk_level==='高危').length; const confirmed=issues.filter(x=>['已确认','已审减','已销号'].includes(x.status)).length; const chains=new Set(issues.map(x=>x.chain_type).filter(Boolean)).size;
    view.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>疑点中心</h2><span class="muted">模型命中只是问题点，需经证据交叉验证、专家定性和主审复核后形成正式结论</span></div><div class="actions"><span class="status red">高风险 ${high}</span><span class="status blue">管理链 ${chains}</span></div></div><div class="decision-grid"><div class="decision-metric red"><span>疑点总数</span><strong>${num(issues.length)}</strong></div><div class="decision-metric red"><span>高风险疑点</span><strong>${num(high)}</strong></div><div class="decision-metric green"><span>已确认 / 审减</span><strong>${num(confirmed)}</strong></div><div class="decision-metric"><span>问题金额</span><strong>${money(issues.reduce((a,x)=>a+Number(x.amount_impact||0),0))}</strong></div></div></div><div class="execution-workspace"><div class="panel issue-pool"><div class="panel-head"><h3>问题池</h3><span class="muted">按风险等级和金额优先排序</span></div>${issues.map(issue=>`<button type="button" class="execution-issue ${issue.issue_id===selectedIssueId?'selected':''}" data-exec-issue="${escHtml(issue.issue_id)}"><span class="execution-issue-main"><b>${escHtml(issue.title)}</b><small>${escHtml(issue.issue_id)} · 模型 ${escHtml(issue.model_code)} · ${escHtml(issue.chain_type)}</small></span><span class="execution-issue-side"><strong>${money(issue.amount_impact)}</strong><span class="status ${issue.risk_level==='高危'?'red':'amber'}">${escHtml(issue.risk_level)}</span></span></button>`).join('')||'<div class="empty">暂无疑点。请先完成资料准备和模型运行。</div>'}</div><div id="executionDetail"></div></div>`;
    if(selected)renderExecutionDetail(selected);
  }
  function renderExecutionDetail(issue){
    const target=document.getElementById('executionDetail'); if(!target)return; let evidence=[];try{const raw=JSON.parse(issue.evidence_json||'[]');evidence=Array.isArray(raw)?raw:(raw?[raw]:[])}catch(_){evidence=[]}
    const data=audit()?.data||{}; const chain=(data.point_line_surface?.surfaces||[]).find(x=>x.id===issue.chain_type); const note=issue.reviewer_decision||'';
    target.innerHTML=`<div class="panel execution-detail"><div class="panel-head"><div><div class="phase-kicker">问题点 · 证据线 · 管理面</div><h2>${escHtml(issue.title)}</h2><span class="muted">${escHtml(issue.description||'')} · ${escHtml(issue.time_phase||'审计执行')}</span></div><span class="status ${issue.risk_level==='高危'?'red':'amber'}">${escHtml(issue.risk_level)}</span></div><div class="chain-strip"><span class="chain-node">模型 ${escHtml(issue.model_code)}</span><span>→</span><span class="chain-node">证据 ${evidence.length} 份</span><span>→</span><span class="chain-node">${escHtml(issue.chain_type||'待归因')}</span><span>→</span><span class="chain-node">${money(issue.amount_impact)}</span></div><div class="grid-2"><section><h3>交叉验证证据</h3>${evidence.map(item=>`<div class="evidence evidence-item"><b>${escHtml(item.document||'来源资料')}</b><p>${escHtml(item.location||'待定位')}</p><p>${escHtml(item.fact||item.content||'已绑定该疑点')}</p><button class="btn small" data-exec-source="${escHtml(item.document||'来源资料')}">查看原件定位</button></div>`).join('')||'<div class="empty">暂无证据定位，转专家会审补证。</div>'}</section><section><h3>模型与管理归因</h3><div class="evidence"><p>模型编码：<b>${escHtml(issue.model_code)}</b></p><p>问题类型：${escHtml(issue.issue_type)}</p><p>金额影响：<strong class="danger-text">${money(issue.amount_impact)}</strong></p><p>管理链：${escHtml(chain?.name||issue.chain_type||'待生成')}</p><p>关联模型：${(chain?.models||[]).map(escHtml).join('、')||'当前问题模型'}</p></div><button class="btn small" id="openExpertForIssue">发起专家会审</button></section></div><div class="panel review-box"><div class="panel-head"><h3>主审复核</h3><span class="muted">正式认定由主审确认</span></div><textarea id="executionReviewNote" rows="4" placeholder="填写事实、证据、制度依据和处理意见">${escHtml(note)}</textarea><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="saveExecutionHold">退回补证</button><button class="btn primary" id="saveExecutionConfirm">确认问题并进入报告</button></div></div></div>`;
    document.getElementById('saveExecutionConfirm').onclick=()=>saveExecutionDecision(issue,'confirm');
    document.getElementById('saveExecutionHold').onclick=()=>saveExecutionDecision(issue,'补充资料');
    document.getElementById('openExpertForIssue').onclick=()=>renderExpertWorkbench(issue);
  }
  async function saveExecutionDecision(issue,decision){try{const result=await apiCall('/api/settlement-demo/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({issue_id:issue.issue_id,decision,reasoning:document.getElementById('executionReviewNote').value,deduction_amount:issue.amount_impact||0})});audit().data=result.state;toast(decision==='confirm'?'问题已确认并进入报告候选':'已退回补充资料');renderExecutionWorkbench()}catch(error){toast(error.message)}}
  function renderExpertWorkbench(issue){
    const view=document.getElementById('executionView'); if(!view)return; const data=audit()?.data||{}; const experts=data.agent_orchestration?.tasks?.find(x=>x.issue_id===issue.issue_id)?.agents||[{role:'合同造价专家'},{role:'现场工程专家'},{role:'财务资金专家'},{role:'法务风控专家'}];
    let savedOpinion='';try{const parsed=JSON.parse(issue.expert_opinion||'[]');savedOpinion=(Array.isArray(parsed)?parsed:[]).map(x=>`【${x.role}】${x.opinion}`).join('\n')}catch(_){}
    view.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>专家会审</h2><span class="muted">当前疑点：${escHtml(issue.title)} · ${escHtml(issue.issue_id)}</span></div><button class="btn" id="backToIssuePool">返回疑点中心</button></div><div class="grid-2"><div><h3>专家席位</h3>${experts.map(expert=>`<div class="expert-seat"><b>${escHtml(expert.role||expert.name||'审计专家')}</b><span class="status blue">可出具意见</span><p>围绕事实、制度依据、证据充分性、风险定性和处置建议发表意见。</p></div>`).join('')}<div class="field" style="margin-top:12px"><label>当前专家角色</label><input id="expertRole" value="合同造价专家"><label style="margin-top:8px">专家意见</label><textarea id="expertOpinion" rows="5" placeholder="填写事实判断、制度依据、证据充分性和处置建议">${escHtml(savedOpinion)}</textarea><button class="btn primary" id="saveExpertOpinion" style="margin-top:8px">保存专家意见</button></div></div><div><h3>制度知识问询</h3><div class="chat"><input id="expertQuestion" value="${escHtml(issue.title)} 的制度依据、证据要求和处理建议是什么？"><button class="btn primary" id="askExpertKnowledge">询问</button></div><div class="answer" id="expertAnswer">问询结果将绑定到当前疑点。</div><div class="evidence" style="margin-top:12px"><p>问题金额：${money(issue.amount_impact)}</p><p>模型：${escHtml(issue.model_code)} · 管理链：${escHtml(issue.chain_type)}</p><p>专家意见不会直接替代主审裁决。</p></div></div></div></div>`;
    document.getElementById('backToIssuePool').onclick=renderExecutionWorkbench;
    document.getElementById('saveExpertOpinion').onclick=async()=>{try{const result=await apiCall('/api/settlement-demo/expert-opinion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({issue_id:issue.issue_id,expert_role:document.getElementById('expertRole').value,opinion:document.getElementById('expertOpinion').value})});audit().data=result.state;toast('专家意见已保存');renderExpertWorkbench(result.issue)}catch(error){toast(error.message)}};
    document.getElementById('askExpertKnowledge').onclick=async()=>{try{const result=await apiCall('/api/settlement-demo/knowledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('expertQuestion').value,context_issue_id:issue.issue_id})});const snippets=(result.records||[]).slice(0,5).map((record,index)=>{const segment=record.segment||record;return `<div class="evidence" style="margin-top:8px"><b>依据 ${index+1} · ${escHtml(segment.document_name||segment.document||'知识库分段')}</b><p>${escHtml(segment.content||segment.answer||'')}</p></div>`}).join('');document.getElementById('expertAnswer').innerHTML=`<b>${escHtml(result.answer||result.content||'制度问询已返回')}</b><p>${escHtml(result.source||'制度知识库')} · ${result.provider==='dify'?'已接入远程知识库':'本地回退'}</p>${snippets}`;}catch(error){toast(error.message)}};
  }
  function openSource(name){
    const drawer=document.getElementById('contextDrawer'); if(drawer){drawer.classList.add('show');const title=document.getElementById('drawerTitle');const body=document.getElementById('drawerBody');if(title)title.textContent='证据原件定位';if(body)body.innerHTML=`<section class="drawer-section"><h3>${escHtml(name)}</h3><p>正在读取本地原件...</p></section>`;apiCall('/api/settlement-demo/source-preview?name='+encodeURIComponent(name)).then(result=>{if(body)body.innerHTML=`<section class="drawer-section"><h3>${escHtml(result.name)}</h3><p class="muted">${escHtml(result.category)} · ${escHtml(result.format)} · ${escHtml(result.path)}</p>${result.content?`<pre class="source-preview">${escHtml(result.content)}</pre>`:'<p>该文件为二进制资料，已完成定位，可在原件查看器中打开。</p>'}</section>`}).catch(error=>{if(body)body.innerHTML=`<section class="drawer-section"><h3>${escHtml(name)}</h3><p>${escHtml(error.message)}</p></section>`});return}
    toast(`已定位来源资料：${name}`);
  }
  const previousNavigate=window.auditNavigate;
  window.auditNavigate=function(phase,tab){
    if(phase==='execution'&&tab==='review'){if(previousNavigate)previousNavigate(phase,tab);setTimeout(renderExecutionWorkbench,0);return false}
    if(phase==='execution'&&tab==='experts'){if(previousNavigate)previousNavigate(phase,tab);setTimeout(()=>{const issue=currentIssues().find(x=>x.issue_id===selectedIssueId)||currentIssues()[0];if(issue)renderExpertWorkbench(issue)},0);return false}
    return previousNavigate?previousNavigate(phase,tab):false;
  };
  document.addEventListener('click',event=>{const issue=event.target.closest('[data-exec-issue]');if(issue){selectedIssueId=issue.dataset.execIssue;renderExecutionWorkbench()}const source=event.target.closest('[data-exec-source]');if(source)openSource(source.dataset.execSource)});
  window.renderExecutionWorkbench=renderExecutionWorkbench;
})();
</script>
</body></html>
